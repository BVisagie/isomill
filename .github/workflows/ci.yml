name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build -w @isomill/schema
      - run: npm run build -w @isomill/catalogue
      - run: npm run build -w @isomill/compiler
      - run: npm run build -w @isomill/resolver
      - run: npm run build -w @isomill/api
      - run: ISOMILL_DEMO=1 NEXT_PUBLIC_BASE_PATH=/isomill npm run build:demo -w @isomill/web
      - run: npm run typecheck
      - run: npm test
