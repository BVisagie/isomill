name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build -w @isomill/schema
      - run: npm run build -w @isomill/catalogue
      - run: npm run build -w @isomill/compiler
      - run: ISOMILL_DEMO=1 NEXT_PUBLIC_BASE_PATH=${{ github.event.repository.name == github.repository_owner && '' || format('/{0}', github.event.repository.name) }} npm run build:demo -w @isomill/web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out
          include-hidden-files: true

      # Dual-write so PR previews can share gh-pages without wiping production.
      # After this has run on main, switch Settings → Pages to Deploy from a
      # branch (gh-pages / root). Keep deploy-pages until that switch; it will
      # start failing once Pages is no longer "GitHub Actions".
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/web/out
          branch: gh-pages
          force: false
          clean-exclude: |
            pr-preview
          commit-message: Deploy production demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
